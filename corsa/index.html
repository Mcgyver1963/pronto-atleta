<!DOCTYPE html><html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Pronto Atleta Corsa</title>
<link rel="manifest" href="manifest.json"><meta name="theme-color" content="#ff6a00"><link rel="apple-touch-icon" href="icon-192.png"><meta name="apple-mobile-web-app-capable" content="yes">
<style>
:root{--bg:#0c1610;--s:#14241a;--s2:#1b3022;--b:#27402d;--t:#e9f0ea;--d:#94a898;--g:#B8A054;--o:#ff6b35;--ok:#3dd598;--no:#ef5350;color-scheme:dark}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--t);font:16px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
header{position:sticky;top:0;z-index:5;display:flex;align-items:center;gap:12px;padding:calc(10px + env(safe-area-inset-top,0px)) 14px 10px;background:#08110b;border-bottom:2px solid var(--g)}
header img{width:44px;height:44px;border-radius:10px}
header b{display:block;font:800 19px/1 "Arial Narrow","Roboto Condensed",system-ui,sans-serif;letter-spacing:1px;color:var(--g)}
header small{color:var(--d);font-size:12px}
#st{margin-left:auto;font-size:11px;color:var(--d);text-align:right}
#ib{margin-left:8px;padding:8px 10px;border:2px solid var(--g);border-radius:6px;background:none;color:var(--g);font:800 11px system-ui}
main{max-width:640px;margin:0 auto;padding:14px 14px calc(88px + env(safe-area-inset-bottom,0px))}
nav{position:fixed;left:0;right:0;bottom:0;display:flex;background:#08110b;border-top:1px solid var(--b);padding-bottom:env(safe-area-inset-bottom,0px);z-index:6}
nav button{flex:1;padding:14px 2px;background:none;border:0;color:var(--d);font:700 12px system-ui;letter-spacing:.6px}
nav button.on{color:var(--g);box-shadow:inset 0 3px 0 var(--g)}
h2{font:800 22px/1.1 "Arial Narrow","Roboto Condensed",system-ui,sans-serif;margin:4px 0 12px;letter-spacing:.5px}
.card{background:var(--s);border:1px solid var(--b);border-radius:10px;padding:14px;margin-bottom:12px}
.big{font:800 46px/1 "Arial Narrow",system-ui,sans-serif;color:var(--g)}
.d{color:var(--d);font-size:13px}
.bar{height:10px;background:var(--s2);border-radius:5px;overflow:hidden;margin:8px 0}
.bar i{display:block;height:100%;background:var(--ok);transition:width .25s}
.row{display:flex;justify-content:space-between;gap:10px;align-items:baseline}
.k{display:grid;grid-template-columns:1fr 1fr;gap:10px}.k .card{margin:0}
.p{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:11px 0;border-bottom:1px solid var(--b)}
.p:last-child{border:0}
.tag{font-size:11px;font-weight:800;padding:3px 8px;border-radius:4px;background:var(--s2)}
.ok{color:var(--ok)}.no{color:var(--no)}.tag.ok{background:rgba(61,213,152,.15)}.tag.no{background:rgba(239,83,80,.15)}
details{background:var(--s);border:1px solid var(--b);border-radius:10px;margin-bottom:10px}
summary{cursor:pointer;padding:13px 14px;list-style:none;display:flex;justify-content:space-between;gap:8px}
summary::-webkit-details-marker{display:none}
.c{color:var(--d);font-size:13px;white-space:nowrap}
.s{padding:6px 14px 10px;border-top:1px solid var(--b)}
.sh{display:flex;justify-content:space-between;gap:8px;margin:6px 0}
.sh b{font-size:15px}
.e{display:flex;gap:12px;align-items:flex-start;padding:9px 0}
.e input{width:24px;height:24px;flex:none;accent-color:var(--ok);margin-top:1px}
.e.f span{color:var(--d);text-decoration:line-through}
.t{background:var(--o);color:#000}
table{width:100%;border-collapse:collapse;font-size:14px}th,td{padding:8px 4px;text-align:left;border-bottom:1px solid var(--b)}th{color:var(--d);font-weight:600}
svg{width:100%;height:auto;display:block}
.qo{display:flex;gap:10px;width:100%;text-align:left;padding:12px;margin:8px 0;background:var(--s2);border:1px solid var(--b);border-radius:8px;color:var(--t);font:inherit}
.qo b{flex:none;width:22px;color:var(--g)}.qo.sel{border-color:var(--g)}.qo.ok{border-color:var(--ok);background:rgba(61,213,152,.15)}.qo.no{border-color:var(--no);background:rgba(239,83,80,.15)}
.b2{padding:12px 16px;border:1px solid var(--b);border-radius:6px;background:var(--s2);color:var(--t);font:700 14px system-ui}.b2.p1{background:var(--o);color:#000;border:0}
.btn{width:100%;margin-top:10px;padding:13px;border:0;border-radius:6px;background:var(--o);color:#000;font:800 15px system-ui}

label{display:block;margin:12px 0 4px;color:var(--d);font-size:13px}
input,select,textarea{width:100%;padding:12px;background:var(--s2);border:1px solid var(--b);border-radius:8px;color:var(--t);font:inherit;min-height:46px}
input[type=checkbox]{width:24px;min-height:0;height:24px}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.err{color:var(--no);font-size:13px;min-height:18px;margin-top:8px}
label.chk{display:flex;gap:10px;align-items:center;color:var(--t);font-size:14px}
label.e{margin:0;color:var(--t);font-size:15px}
.tag.t{margin:2px 0}
textarea{font-size:12px;margin-top:8px}.b2{width:100%;margin-top:8px}
summary b{font-size:15px}
</style></head><body>

<script>/* Motore di Pronto Atleta Corsa: ritmi da test (modello VDOT), obiettivo, piano a settimane. */
var PAE=(function(){
var DIST={5:{n:"5 km",m:5000,taper:1,minW:6,ideal:12},10:{n:"10 km",m:10000,taper:1,minW:8,ideal:14},21:{n:"Mezza maratona",m:21097.5,taper:2,minW:10,ideal:18},42:{n:"Maratona",m:42195,taper:3,minW:14,ideal:20}};
var TESTS={1000:{n:"1000 m",m:1000},3000:{n:"3000 m",m:3000},5000:{n:"5 km",m:5000},10000:{n:"10 km",m:10000},21097:{n:"Mezza maratona",m:21097.5},cooper:{n:"Cooper (12 minuti)",m:0}};
var LEV=["principiante","intermedio","avanzato"];
function pad(n){return(n<10?"0":"")+n}
function addDays(d,n){var x=new Date(d.getTime());x.setDate(x.getDate()+n);return x}
function iso(d){return d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate())}
function parseISO(s){var a=String(s).split("-");return new Date(+a[0],+a[1]-1,+a[2],12,0,0)}
function mondayOf(d){var x=new Date(d.getTime()),k=(x.getDay()+6)%7;x.setDate(x.getDate()-k);return x}
function daysBetween(a,b){return Math.round((b-a)/864e5)}
var GG=["lun","mar","mer","gio","ven","sab","dom"],MESI=["gen","feb","mar","apr","mag","giu","lug","ago","set","ott","nov","dic"];
function dow(d){return(d.getDay()+6)%7}
function fdate(d){return GG[dow(d)]+" "+d.getDate()+" "+MESI[d.getMonth()]}
function clamp(x,a,b){return Math.max(a,Math.min(b,x))}
function r5(x){return Math.round(x*2)/2}                   /* mezzo chilometro */
function fkm(x){return String(Math.round(x*10)/10).replace(".",",")}
/* tempi */
function fmtT(s){s=Math.round(s);var h=Math.floor(s/3600),m=Math.floor(s%3600/60),r=s%60;return h?h+":"+pad(m)+":"+pad(r):m+":"+pad(r)}
function fpace(s){s=Math.round(s);return Math.floor(s/60)+":"+pad(s%60)}
function parseT(str,long){ /* long: due numeri = ore:minuti (mezza, maratona) */
 if(str==null)return null;str=String(str).trim().replace(/[hH]/g,":").replace(/['′]/g,":").replace(/["″]/g,"").replace(/\./g,":").replace(/,/g,":").replace(/:+$/,"");
 if(!str)return null;var a=str.split(":").map(Number);if(a.some(function(x){return isNaN(x)||x<0}))return null;
 if(a.length==1)return long?a[0]*3600:a[0]*60;
 if(a.length==2)return long?a[0]*3600+a[1]*60:a[0]*60+a[1];
 if(a.length==3)return a[0]*3600+a[1]*60+a[2];return null}
/* modello VDOT (Daniels) */
function vo2(v){return -4.6+0.182258*v+0.000104*v*v}
function pct(t){return 0.8+0.1894393*Math.exp(-0.012778*t)+0.2989558*Math.exp(-0.1932605*t)}
function vdotOf(m,sec){var t=sec/60;return vo2(m/t)/pct(t)}
function vFromVo2(x){var a=0.000104,b=0.182258,c=-(4.6+x);return(-b+Math.sqrt(b*b-4*a*c))/(2*a)}
function predict(m,vd){var lo=2,hi=900;for(var i=0;i<70;i++){var mid=(lo+hi)/2;if(vdotOf(m,mid*60)>vd)lo=mid;else hi=mid}return(lo+hi)/2*60}
function testVdot(tipo,val){if(tipo=="cooper")return vdotOf(val,12*60);return vdotOf(TESTS[tipo].m,val)}
function volAdj(d,km){ /* correzione sulle distanze lunghe in base ai km settimanali */
 if(d==42)return km<30?1.08:km<40?1.05:km<55?1.025:1;
 if(d==21)return km<20?1.05:km<30?1.03:km<40?1.015:1;
 if(d==10)return km<15?1.02:1;return 1}
function hrMax(P){return P.fcMax?+P.fcMax:Math.round(208-0.7*P.eta)}
function hrZones(P){var mx=hrMax(P),rs=P.fcRiposo?+P.fcRiposo:0,Z;
 if(rs>0&&rs<mx-30)Z=[[.5,.6],[.6,.7],[.7,.8],[.8,.9],[.9,1]].map(function(z){return[Math.round(rs+z[0]*(mx-rs)),Math.round(rs+z[1]*(mx-rs))]});
 else Z=[[.6,.7],[.7,.8],[.8,.87],[.87,.93],[.93,1]].map(function(z){return[Math.round(mx*z[0]),Math.round(mx*z[1])]});
 return{max:mx,metodo:rs>0&&rs<mx-30?"riserva cardiaca":"% della FC massima",z:Z,nomi:["Recupero","Lento","Medio","Soglia","Massimo"]}}
function paces(vd){function pv(x){return 60000/vFromVo2(vd*x)}
 return{eMin:pv(.70),eMax:pv(.62),T:pv(.88),I:pv(.98),R:pv(1.08),medio:(pv(.70)+pv(.88))/2,M:predict(42195,vd)/42.195}}
/* valutazione di profilo e obiettivo */
function assess(P,today){
 today=today||new Date();var d=+P.dist,D=DIST[d];
 var vd=testVdot(P.test.tipo,+P.test.val),adj=volAdj(d,+P.kmSett||0);
 var now=predict(D.m,vd)*adj,start=parseISO(P.inizio),race=parseISO(P.dataGara);
 var from=today>start?today:start,weeks=Math.max(0,Math.floor(daysBetween(from,race)/7));
 var improv=Math.min(P.eta>=45?0.025:0.04,weeks*0.003);
 var sugg=now*(1-improv),goal=P.obiettivo?+P.obiettivo:sugg,ratio=goal/now,msg,cls;
 if(ratio>=1.0){msg="Obiettivo prudente: lo puoi già fare oggi.";cls="ok"}
 else if(ratio>=0.975){msg="Obiettivo realistico con il piano.";cls="ok"}
 else if(ratio>=0.95){msg="Obiettivo ambizioso: serve costanza.";cls="mid"}
 else if(ratio>=0.92){msg="Obiettivo molto ambizioso: servono più settimane o più km.";cls="no"}

function weekChart(ws,G,cur){const W=320,H=130,L=6,R=6,TP=10,B=22,n=ws.length,bw=(W-L-R)/n;let mx=1;
 const P=ws.map(w=>G[w].reduce((a,s)=>a+s.km,0)),D=ws.map(w=>G[w].reduce((a,s)=>{const c=sCount(s);return a+s.km*c[0]/c[1]},0));P.forEach(v=>mx=Math.max(mx,v));
 let s='<svg viewBox="0 0 '+W+' '+(H+TP+B)+'" role="img" aria-label="Km a settimana">';
 ws.forEach((w,i)=>{const x=L+i*bw+1,ph=P[i]/mx*H,dh=D[i]/mx*H,bwid=Math.max(2,bw-2);

  if(dh>0)s+='<rect x="'+x+'" y="'+(TP+H-dh)+'" width="'+bwid+'" height="'+dh+'" rx="2" fill="#3dd598"/>';
  if(n<=24||i%2==0)s+='<text x="'+(x+bwid/2)+'" y="'+(H+TP+14)+'" fill="#94a898" font-size="9" text-anchor="middle">'+w+'</text>'});

 s+='<line x1="'+L+'" x2="'+(W-R)+'" y1="'+y(goal)+'" y2="'+y(goal)+'" stroke="#B8A054" stroke-dasharray="4 3"/><text x="'+(L-4)+'" y="'+(y(goal)+4)+'" fill="#B8A054" font-size="10" text-anchor="end">'+E.fmtT(goal)+'</text>';

function validate(p){
 if(!(p.eta>=12&&p.eta<=85))return"Scrivi un’età tra 12 e 85 anni.";
 if(!p.dataGara||isNaN(E.parseISO(p.dataGara)))return"Scegli la data della gara.";

 if(!p.inizio||isNaN(E.parseISO(p.inizio)))return"Scegli quando inizia il piano.";
 if(E.parseISO(p.inizio)>=E.parseISO(p.dataGara))return"Il piano deve iniziare prima della gara.";
 if(p._ob&&!p.obiettivo)return"Il tempo obiettivo non è valido: scrivilo come 49:30 oppure 1:45:00.";
 if(!p.test.val||!(p.test.val>0))return p.test.tipo=="cooper"?"Scrivi i metri percorsi nel test di Cooper, per esempio 2400.":"Scrivi il tempo del test, per esempio 27:30.";
 if(p.test.tipo!="cooper"&&p.test.val<E.TESTS[p.test.tipo].m/1000*130)return"Il tempo del test è troppo basso per essere vero: controlla minuti e secondi.";
 if(p.test.tipo=="cooper"&&(p.test.val<1000||p.test.val>4500))return"I metri del Cooper devono essere tra 1000 e 4500.";
 if(!(p.kmSett>=0&&p.kmSett<=150))return"Scrivi i km che corri ora a settimana (anche 0).";
