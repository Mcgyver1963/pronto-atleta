<!DOCTYPE html><html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Pronto Atleta Salto in Alto</title>
<link rel="manifest" href="manifest.json"><meta name="theme-color" content="#ff6a00"><link rel="apple-touch-icon" href="icon-192.png"><meta name="apple-mobile-web-app-capable" content="yes">
<style>
:root{--bg:#0c1610;--s:#14241a;--s2:#1b3022;--b:#27402d;--t:#e9f0ea;--d:#94a898;--g:#B8A054;--o:#ff6b35;--ok:#3dd598;--no:#ef5350;color-scheme:dark}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--t);font:16px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
header{position:sticky;top:0;z-index:5;display:flex;align-items:center;gap:12px;padding:calc(10px + env(safe-area-inset-top,0px)) 14px 10px;background:#08110b;border-bottom:2px solid var(--g)}
header img{width:44px;height:44px;border-radius:10px}
header b{display:block;font:800 19px/1 "Arial Narrow","Roboto Condensed",system-ui,sans-serif;letter-spacing:1px;color:var(--g)}
header small{color:var(--d);font-size:12px}
#st{margin-left:auto;font-size:11px;color:var(--d);text-align:right}
#ib{margin-left:8px;padding:8px 10px;border:2px solid var(--g);border-radius:6px;background:none;color:var(--g);font:800 11px system-ui}
main{max-width:640px;margin:0 auto;padding:14px 14px calc(88px + env(safe-area-inset-bottom,0px))}
nav{position:fixed;left:0;right:0;bottom:0;display:flex;background:#08110b;border-top:1px solid var(--b);padding-bottom:env(safe-area-inset-bottom,0px);z-index:6}
nav button{flex:1;padding:14px 2px;background:none;border:0;color:var(--d);font:700 12px system-ui;letter-spacing:.6px}
nav button.on{color:var(--g);box-shadow:inset 0 3px 0 var(--g)}
h2{font:800 22px/1.1 "Arial Narrow","Roboto Condensed",system-ui,sans-serif;margin:4px 0 12px;letter-spacing:.5px}
.card{background:var(--s);border:1px solid var(--b);border-radius:10px;padding:14px;margin-bottom:12px}
.big{font:800 46px/1 "Arial Narrow",system-ui,sans-serif;color:var(--g)}
.d{color:var(--d);font-size:13px}
.bar{height:10px;background:var(--s2);border-radius:5px;overflow:hidden;margin:8px 0}
.bar i{display:block;height:100%;background:var(--ok);transition:width .25s}
.row{display:flex;justify-content:space-between;gap:10px;align-items:baseline}
.k{display:grid;grid-template-columns:1fr 1fr;gap:10px}.k .card{margin:0}
.p{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:11px 0;border-bottom:1px solid var(--b)}
.p:last-child{border:0}
.tag{font-size:11px;font-weight:800;padding:3px 8px;border-radius:4px;background:var(--s2)}
.ok{color:var(--ok)}.no{color:var(--no)}.tag.ok{background:rgba(61,213,152,.15)}.tag.no{background:rgba(239,83,80,.15)}
details{background:var(--s);border:1px solid var(--b);border-radius:10px;margin-bottom:10px}
summary{cursor:pointer;padding:13px 14px;list-style:none;display:flex;justify-content:space-between;gap:8px}
summary::-webkit-details-marker{display:none}
.c{color:var(--d);font-size:13px;white-space:nowrap}
.s{padding:6px 14px 10px;border-top:1px solid var(--b)}
.sh{display:flex;justify-content:space-between;gap:8px;margin:6px 0}
.sh b{font-size:15px}
.e{display:flex;gap:12px;align-items:flex-start;padding:9px 0}
.e input{width:24px;height:24px;flex:none;accent-color:var(--ok);margin-top:1px}
.e.f span{color:var(--d);text-decoration:line-through}
.t{background:var(--o);color:#000}
table{width:100%;border-collapse:collapse;font-size:14px}th,td{padding:8px 4px;text-align:left;border-bottom:1px solid var(--b)}th{color:var(--d);font-weight:600}
svg{width:100%;height:auto;display:block}
.qo{display:flex;gap:10px;width:100%;text-align:left;padding:12px;margin:8px 0;background:var(--s2);border:1px solid var(--b);border-radius:8px;color:var(--t);font:inherit}
.qo b{flex:none;width:22px;color:var(--g)}.qo.sel{border-color:var(--g)}.qo.ok{border-color:var(--ok);background:rgba(61,213,152,.15)}.qo.no{border-color:var(--no);background:rgba(239,83,80,.15)}
.b2{padding:12px 16px;border:1px solid var(--b);border-radius:6px;background:var(--s2);color:var(--t);font:700 14px system-ui}.b2.p1{background:var(--o);color:#000;border:0}
.btn{width:100%;margin-top:10px;padding:13px;border:0;border-radius:6px;background:var(--o);color:#000;font:800 15px system-ui}

label{display:block;margin:12px 0 4px;color:var(--d);font-size:13px}
input,select,textarea{width:100%;padding:12px;background:var(--s2);border:1px solid var(--b);border-radius:8px;color:var(--t);font:inherit;min-height:46px}
input[type=checkbox]{width:24px;min-height:0;height:24px}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.err{color:var(--no);font-size:13px;min-height:18px;margin-top:8px}
label.chk{display:flex;gap:10px;align-items:center;color:var(--t);font-size:14px}
label.e{margin:0;color:var(--t);font-size:15px}
.tag.t{margin:2px 0}
textarea{font-size:12px;margin-top:8px}.b2{width:100%;margin-top:8px}
summary b{font-size:15px}
.dg{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;margin-top:6px}
label.dgl{flex-direction:column;gap:4px;margin:0;padding:8px 0;background:var(--s2);border:1px solid var(--b);border-radius:8px;font-size:13px;justify-content:center}
.card.sel{border-color:var(--o)}
#nav button{font-size:11px;padding-left:2px;padding-right:2px}
</style></head><body>

/* ---- anteprima del profilo (non salva) ---- */
function readForm(){const g=id=>{const e=document.getElementById(id);return e?e.value:""};
 const giorni=$$("[data-g]").filter(c=>c.checked).map(c=>+c.dataset.g),ev=+g("f_ev"),td=+g("f_td"),ob=g("f_obj").trim()?E.parseT(g("f_obj")):null;
 return{nome:g("f_nome").trim()||"Atleta",eta:parseInt(g("f_eta"),10),sesso:g("f_sesso"),cat:g("f_cat"),ev:ev,dataGara:g("f_data"),obiettivo:ob,passi:parseInt(g("f_passi"),10)||null,test:{d:td,val:E.parseT(g("f_tval")),data:g("f_tdata")},livello:g("f_liv"),giorni:giorni,inizio:g("f_inizio"),_ob:g("f_obj").trim()}}
function plaus(d,t){return t>=30&&t<=260}
function validate(p){
 if(!(p.eta>=4&&p.eta<=90))return"Scrivi un’età tra 4 e 90 anni.";
 if(!E.CATS[p.cat])return"Scegli la categoria.";
 if(!E.EV[p.ev])return"Scegli il salto.";
 if(!p.dataGara||isNaN(E.parseISO(p.dataGara)))return"Scegli la data della gara.";
 if(E.parseISO(p.dataGara)<=now())return"La data della gara deve essere futura.";
 if(!p.inizio||isNaN(E.parseISO(p.inizio)))return"Scegli quando inizia il piano.";
 if(E.parseISO(p.inizio)>=E.parseISO(p.dataGara))return"Il piano deve iniziare prima della gara.";
 if(p._ob&&!p.obiettivo)return"L’altezza obiettivo non è valida: scrivila in cm, per esempio 140.";
 if(p.obiettivo&&!plaus(p.ev,p.obiettivo))return"L’altezza obiettivo non è credibile: controlla i centimetri.";
 if(!p.test.val)return"Scrivi l’altezza del test in cm, per esempio 135.";
 if(!plaus(p.test.d,p.test.val))return"L’altezza del test non è credibile: controlla i centimetri.";
 if(p.passi&&(p.passi<3||p.passi>25))return"I passi di rincorsa devono essere tra 3 e 25.";
 if(!p.test.data)return"Scegli la data del test.";
 if(p.giorni.length<2)return"Scegli almeno 2 giorni di allenamento.";return""}
function preview(){const el=$("#pv");if(!el)return;const p=readForm(),er=validate(p),ev=$("#f_ev");
 if(ev&&ev.dataset.cat!=p.cat){ev.dataset.cat=p.cat;const cur=ev.value||S.p.ev;ev.innerHTML=evOptions(p.cat,cur);p.ev=+ev.value}
 if(er){el.innerHTML='<div class="d">Anteprima</div><div class="err" style="min-height:0">'+esc(er)+'</div>';return}
 const A=E.assess(p,now()),C=E.CATS[p.cat],b=E.build(p,now()),ok=p.eta>=C.age[0]-1&&p.eta<=C.age[1]+1;
 el.innerHTML='<div class="row"><b>Anteprima del profilo</b><span class="tag '+tclass(A)+'">'+tword(A)+'</span></div>'+
 '<div class="d">Oggi stimi <b>'+E.fmtT(A.now)+' cm</b> nel '+esc(E.EV[p.ev].n.toLowerCase())+' · obiettivo <b>'+E.fmtT(A.goal)+' cm</b>'+(p.obiettivo?'':' <i>suggerito</i>')+'</div><div class="d" style="margin-top:4px">'+esc(A.msg)+(A.intermedio?' Traguardo intermedio: <b>'+E.fmtT(A.intermedio)+' cm</b>.':'')+'</div>'+
 '<div class="d" style="margin-top:6px">Piano di <b>'+b.W+'</b> settimane, '+p.giorni.length+' sedute a settimana.</div><div class="d" style="margin-top:4px">Rincorsa di riferimento per la categoria: <b>'+E.stepr(p.cat,p.sesso,p.eta).slice(0,2).join('-')+'</b> passi'+(p.passi?'':' (uso '+E.stepr(p.cat,p.sesso,p.eta)[2]+')')+'.</div>'+
 (ok?'':'<div class="d" style="color:var(--o);margin-top:6px">⚠ L’età non corrisponde alla categoria scelta ('+esc(C.n)+'): controlla.</div>')+
 b.warn.map(w=>'<div class="d" style="color:var(--o);margin-top:6px">⚠ '+esc(w)+'</div>').join('')}
/* ---- eventi ---- */
function render(){$$("#nav button").forEach(b=>b.className=b.dataset.t==tab?"on":"");$("#v").innerHTML=V[tab]();$("#who").textContent=S.p.nome.split(" ")[0]+" · "+evN();window.scrollTo(0,0);
 if(tab=="prof"){const ev=$("#f_ev");ev.dataset.cat=S.p.cat;ev.innerHTML=evOptions(S.p.cat,S.p.ev);preview()}flash=""}
document.addEventListener("click",e=>{
 const nv=e.target.closest("#nav button");if(nv){tab=nv.dataset.t;delAsk=null;render();return}
 const go=e.target.closest("[data-go]");if(go){tab=go.dataset.go;render();return}
 const op=e.target.closest("[data-open]");if(op){setSel(+op.dataset.open);tab="home";render();return}
 const ad=e.target.closest("[data-adel]");if(ad){const id=+ad.dataset.adel;if(delAsk!=id){delAsk=id;render();return}
  if(R.ath.length<=1){delAsk=null;render();return}R.ath=R.ath.filter(a=>a.id!=id);delAsk=null;if(S.id==id)setSel(R.ath[0].id);save();render();return}
 const sd=e.target.closest("[data-sldel]");if(sd){S.sl=S.sl.filter(x=>x.id!=sd.dataset.sldel);save();render();return}
 const d=e.target.closest("[data-del]");if(d){S.tests=S.tests.filter(t=>t.id!=d.dataset.del);save();render();return}
 const b=e.target.closest("button");if(!b)return;
 if(b.id=="a_add"){const a=newAth({nome:"Nuovo atleta",eta:10,cat:"e10"});R.ath.push(a);regen(a);setSel(a.id);tab="prof";render();return}
 if(b.id=="f_save"){const p=readForm(),er=validate(p);$("#f_err").textContent=er;if(er)return;delete p._ob;const old=S.p.test;
  if(p.test.d!=old.d||p.test.val!=old.val||p.test.data!=old.data)S.tests.push({id:Date.now(),data:p.test.data,d:p.test.d,val:p.test.val,nota:"dal profilo"});
  S.p=p;S.demo=false;regen();flash="Profilo salvato: piano ricalcolato da questa settimana.";tab="prof";render()}
 else if(b.id=="sl_add"){const cm=parseInt(($("#sl_cm").value||"").replace(",","."),10),data=$("#sl_data").value,er=$("#sl_err");
  if(!data){er.textContent="Scegli la data.";return}
  if(!(cm>=30&&cm<=350)){er.textContent="Scrivi la distanza in centimetri, per esempio 135.";return}
  S.sl.push({id:Date.now(),data:data,cm:cm});save();render()}
 else if(b.id=="t_add"){const d=+$("#t_d").value,val=E.parseT($("#t_val").value),data=$("#t_data").value,er=$("#t_err");
  if(!data){er.textContent="Scegli la data del test.";return}
  if(!val||!plaus(d,val)){er.textContent="Scrivi un’altezza valida, per esempio 135 (cm) oppure 1,35 (m).";return}
  S.tests.push({id:Date.now(),data:data,d:d,val:val,nota:""});
  if($("#t_ref").checked){S.p.test={d:d,val:val,data:data};S.demo=false;regen()}save();render()}
 else if(b.id=="bk_out"){$("#bk").value=JSON.stringify(R);$("#bk").select();try{navigator.clipboard.writeText($("#bk").value).catch(()=>{})}catch(x){}$("#bk_err").textContent="Copia pronta: se non si è copiata da sola, selezionala e copiala."}
 else if(b.id=="bk_in"){try{const o=JSON.parse($("#bk").value);if(!o||!o.ath||!o.ath.length||!o.ath.every(a=>a&&a.p&&a.plan&&a.p.cat&&a.p.ev))throw 0;R=o;setSel(R.sel);save();tab=MODE=="coach"?"atl":"home";render()}catch(x){$("#bk_err").textContent="Questa copia non è valida: incolla il testo intero."}}});
document.addEventListener("change",e=>{const t=e.target;
 if(t.dataset&&t.dataset.t){S.ticks[t.dataset.t]=t.checked;save();t.closest(".e").classList.toggle("f",t.checked);upd();return}
 if(t.closest&&t.closest("#pf"))preview()});
document.addEventListener("input",e=>{if(e.target.closest&&e.target.closest("#pf"))preview()});
document.addEventListener("toggle",e=>{if(e.target.dataset&&e.target.dataset.wk)openW[e.target.dataset.wk]=e.target.open},true);
function upd(){const A2=all(),T=tot(A2),a=$("#tp"),b=$("#tb");if(a){a.textContent=pc(T[0],T[1])+"%";b.style.width=pc(T[0],T[1])+"%"}
 $$("[data-w]").forEach(n=>{const w=+n.dataset.w,c=tot(A2.filter(s=>s.settimana==w));n.textContent=c[0]+"/"+c[1]})}
function sa(){return(window.matchMedia&&matchMedia("(display-mode: standalone)").matches)||navigator.standalone===true}
function ib(){const b=$("#ib");if(b&&window.__paInstall&&!sa())b.hidden=false}
window.addEventListener("beforeinstallprompt",e=>{e.preventDefault();window.__paInstall=e;ib()});
$("#ib").addEventListener("click",()=>{const e=window.__paInstall;if(!e)return;e.prompt();if(e.userChoice)e.userChoice.then(()=>{$("#ib").hidden=true;window.__paInstall=null})});ib();
render();
if("serviceWorker" in navigator)navigator.serviceWorker.register("./sw.js").catch(()=>{});
window.__PA_DEBUG={R:()=>R,S:()=>S,render:render};
})();
</script></body></html>
